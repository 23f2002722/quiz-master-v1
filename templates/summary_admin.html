{% extends "base.html" %}

{% block title %}Admin Summary{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Welcome, {{ user.full_name }}</h1>

    <h3>Subject-wise Top Scores</h3>
    <canvas id="topScoresChart" width="400" height="200"></canvas>

    <h3>Subject-wise User Attempts</h3>
    <canvas id="userAttemptsChart" width="400" height="200"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Data for Subject-wise Top Scores
    const topScoresData = {
        labels: [{% for subject in subject_wise_top_scores %}"{{ subject.name }}",{% endfor %}],
        datasets: [{
            label: 'Top Scores',
            data: [{% for subject in subject_wise_top_scores %}{{ subject.top_score }},{% endfor %}],
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)'
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)'
            ],
            borderWidth: 1
        }]
    };

    // Data for Subject-wise User Attempts
    const userAttemptsData = {
        labels: [{% for subject in subject_wise_user_attempts %}"{{ subject.name }}",{% endfor %}],
        datasets: [{
            label: 'User Attempts',
            data: [{% for subject in subject_wise_user_attempts %}{{ subject.user_count }},{% endfor %}],
            backgroundColor: [
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)',
                'rgba(255, 159, 64, 0.2)'
            ],
            borderColor: [
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)',
                'rgba(255, 159, 64, 1)'
            ],
            borderWidth: 1
        }]
    };

    // Render Subject-wise Top Scores Chart
    const topScoresCtx = document.getElementById('topScoresChart').getContext('2d');
    new Chart(topScoresCtx, {
        type: 'bar',
        data: topScoresData,
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    // Render Subject-wise User Attempts Chart
    const userAttemptsCtx = document.getElementById('userAttemptsChart').getContext('2d');
    new Chart(userAttemptsCtx, {
        type: 'bar',
        data: userAttemptsData,
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
{% endblock %}
