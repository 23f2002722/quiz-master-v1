{% extends "base.html" %}
{% block title %}Add Question{% endblock %}
{% block content %}

<div class="container flex-grow-1 d-flex flex-column mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center text-warning mb-4">New Question</h2>

            <div class="card shadow-lg">
                <div class="card-body">
                    <form action="/dashboard/quiz_management/add_question/{{quiz.id}}" method="POST">
                        <div class="mb-3">
                            <h5><strong>Chapter Name:</strong> {{ quiz.chapter.name }}</h5>
                            <h5><strong>Quiz Type:</strong> {{ quiz.type }}</h5>
                            <h3 class="mt-3"><strong>Q.No. {{ count }}</strong></h3>
                        </div>

                        <div class="mb-3">
                            <label for="question_statement" class="form-label">Question Statement:</label>
                            <textarea id="question_statement" name="question_statement" rows="3" class="form-control" required></textarea>
                        </div>

                        <h4 class="text-primary">Single Option Correct</h4>

                        <div class="mb-3">
                            <label for="option1" class="form-label">Option A:</label>
                            <input type="text" id="option1" name="option1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="option2" class="form-label">Option B:</label>
                            <input type="text" id="option2" name="option2" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="option3" class="form-label">Option C:</label>
                            <input type="text" id="option3" name="option3" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="option4" class="form-label">Option D:</label>
                            <input type="text" id="option4" name="option4" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="correct_option" class="form-label">Correct Option:</label>
                            <select id="correct_option" name="correct_option" class="form-select" required>
                                <option value="1">A</option>
                                <option value="2">B</option>
                                <option value="3">C</option>
                                <option value="4">D</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('quiz_management') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save and Next</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
