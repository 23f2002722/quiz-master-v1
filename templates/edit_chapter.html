{% extends "base.html" %}
{% block title %}Edit Chapter{% endblock %}
{% block content %}

<div class="container flex-grow-1 d-flex flex-column mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center text-warning mb-4">Edit Chapter</h2>
            <div class="card shadow-lg">
                <div class="card-body">
                    <form action="{{ url_for('edit_chapter', chapter_id=chapter.id) }}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Chapter Name:</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ chapter.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Chapter Description:</label>
                            <textarea class="form-control" id="description" name="description" rows="3" required>{{ chapter.description }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
