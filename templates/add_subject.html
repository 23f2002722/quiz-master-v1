{% extends "base.html" %} 
{% block title %}Add Subject{% endblock %} 

{% block content %}
<div class="container mt-4">
    <h2 class="text-center text-warning mb-4">New Subject</h2>
    
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm rounded p-4">
                <form action="/dashboard/admin/add_subject" method="POST">
                    <div class="mb-3">
                        <label for="subjectName" class="form-label">Name:</label>
                        <input type="text" class="form-control" id="subjectName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="subjectDescription" class="form-label">Description:</label>
                        <textarea class="form-control" id="subjectDescription" name="description" rows="3" required></textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ request.referrer }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
