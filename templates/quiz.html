{% extends "base.html" %}

{% block title %}Quiz{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Question {{ index }}/{{ total }}</h2>
    
    <div class="alert alert-info">Time Remaining: <span id="timer" class="fw-bold">{{ time_left // 60 }}</span> minutes <span id="timer-seconds" class="fw-bold">{{ time_left % 60 }}</span> seconds</div>

    <div class="card shadow-sm p-4">
        <form method="POST">
            <p class="h5">{{ question.question_statement }}</p>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="option1" name="option" value="1" {% if selected == "1" %}checked{% endif %}>
                <label class="form-check-label" for="option1">{{ question.option1 }}</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="option2" name="option" value="2" {% if selected == "2" %}checked{% endif %}>
                <label class="form-check-label" for="option2">{{ question.option2 }}</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="option3" name="option" value="3" {% if selected == "3" %}checked{% endif %}>
                <label class="form-check-label" for="option3">{{ question.option3 }}</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="option4" name="option" value="4" {% if selected == "4" %}checked{% endif %}>
                <label class="form-check-label" for="option4">{{ question.option4 }}</label>
            </div>
            <div class="mt-4">
                <button type="submit" name="prev" class="btn btn-secondary" {% if index == 1 %}disabled{% endif %}>Previous</button>
                <button type="submit" name="next" class="btn btn-primary" {% if index == total %}disabled{% endif %}>Next</button>
                <button type="submit" name="submit" class="btn btn-success">Submit</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Timer countdown
    let timeLeft = {{ time_left }};
    
    function updateTimer() {
        if (timeLeft <= 0) {
            document.forms[0].submit();
            return;
        }
        
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("timer").textContent = minutes;
        document.getElementById("timer-seconds").textContent = seconds.toString().padStart(2, '0');

        timeLeft--;
        setTimeout(updateTimer, 1000);
    }

    updateTimer();
</script>
{% endblock %}
