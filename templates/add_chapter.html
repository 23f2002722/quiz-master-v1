{% extends "base.html" %} 
{% block title %}Add Chapter{% endblock %} 
{% block content %}
<br>
<div class="container flex-grow-1 d-flex flex-column">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center text-warning mb-4">New Chapter</h2>
            <div class="card shadow-lg">
                <div class="card-body">
                    <form action="/dashboard/admin/add_chapter/{{subject_id}}" method="POST">
                        <div class="mb-3">
                            <label for="subjectName" class="form-label">Name:</label>
                            <input type="text" class="form-control" id="subjectName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="subjectDescription" class="form-label">Description:</label>
                            <textarea class="form-control" id="subjectDescription" name="description" rows="3" required></textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                            
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
