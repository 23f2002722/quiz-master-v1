{% extends "base.html" %} 

{% block title %}Add Quiz{% endblock %} 

{% block content %}

<div class="container mt-4">
    <h2 class="text-center">New Quiz</h2>
    <div class="card p-4 shadow-sm">
        <form action="/dashboard/quiz_management/add_quiz" method="POST">
            <div class="mb-3">
                <label for="chapter" class="form-label">Chapter ID</label>
                <select id="chapter" name="chapter_id" class="form-select">
                    <option value="">Select Chapter</option>
                    {% for ch in chapter %}
                    <option value="{{ ch.id }}">{{ ch.id }} [{{ ch.name }}]</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="text" class="form-label">Type</label>
                <input type="text" id="text" name="type" class="form-control">
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="date" name="date" min="{{ current_date }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="duration" class="form-label">Duration (in minutes)</label>
                <input type="number" id="duration" name="duration" class="form-control">
            </div>

            <div class="mb-3">
                <label for="remarks" class="form-label">Remarks</label>
                <input type="text" id="remarks" name="remarks" class="form-control">
            </div>

            <div class="d-flex justify-content-between">
                <a href="{{ request.referrer }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
