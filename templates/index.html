{% extends 'base.html' %}
{% block title %}Login Page{% endblock %}
{% block content %}



<div class="container py-5">
    <div class="text-center mb-4">
        <h1 style="color: navy; font-family: 'Montserrat', sans-serif">Welcome to QuizMaster</h1>
        <h4 style="color: #4d4d4d; font-family: 'Lobster', cursive">Challenge Your Mind</h4>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-lg">
          <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4">
                <h4 class="mb-2">Login</h4>
            </div>

<!-- Login Form -->
<form action="" method="post">
    <div class="mb-4">
        <div class="input-group">
            
            <input type="text" 
                   class="form-control" 
                   name="username" 
                   placeholder="Username (email)"
                   required>
        </div>
    </div>
    <div class="mb-4">
        <div class="input-group">
            
            <input type="password" 
                   class="form-control" 
                   name="password" 
                   placeholder="Password"
                   required>
        </div>
    </div>
    <div class="d-grid mb-4">
        <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-box-arrow-in-right me-2"></i>Log In
        </button>
    </div>
</form>

<!-- Links -->
<div class="text-center">
    <div class="mb-3">
        <span class="text-muted">New to QuizMaster?</span>
        <div class="mt-2">
            <a href="{{ url_for('register_user') }}" class="btn btn-outline-primary me-2">
                <i class="bi bi-mortarboard me-1"></i>Register Yourself
            </a>
        </div>
    </div>
 
</div>
</div>
</div>
</div>
</div>   
{% endblock %}
